<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elbo Room - Merch Tracker</title>
<style>
:root {
  --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e; --border: #2a2a2a;
  --text: #e0e0e0; --dim: #888; --accent: #ff3b3b; --accent2: #ff6b6b;
  --green: #4caf50; --yellow: #ffc107; --blue: #42a5f5;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* SCREENS */
.gate-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:8px; }
.gate-screen h1 { font-size:2em; color:var(--accent); letter-spacing:2px; }
.gate-input { width:220px; padding:12px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; font-size:1.1em; text-align:center; }
.gate-btn { padding:10px 32px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:1em; cursor:pointer; margin-top:8px; }
.gate-error { color:var(--accent); min-height:20px; font-size:0.9em; }
.name-btn { width:180px; padding:14px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; font-size:1.1em; cursor:pointer; }
.name-btn:active { background:var(--accent); border-color:var(--accent); }

/* NAV */
#app { display:none; }
.top-bar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
.top-bar h2 { font-size:1em; color:var(--accent); }
.top-bar .user-badge { color:var(--dim); font-size:0.85em; cursor:pointer; }
.tabs { display:flex; gap:0; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; }
.tab { padding:10px 14px; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; font-size:0.85em; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* PANELS */
.panel { display:none; padding:16px; }
.panel.active { display:block; }

/* INVENTORY */
.category-header { font-size:1.1em; color:var(--accent2); margin:20px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--border); }
.category-header:first-child { margin-top:0; }
.item-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:8px; }
.item-card .item-name { font-weight:600; margin-bottom:6px; display:flex; justify-content:space-between; }
.item-card .item-total { color:var(--green); font-size:0.9em; }
.size-grid { display:flex; flex-wrap:wrap; gap:6px; }
.size-chip { background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:4px 8px; font-size:0.8em; min-width:55px; text-align:center; }
.size-chip .sz { color:var(--dim); }
.size-chip .ct { color:var(--text); font-weight:600; }
.size-chip.zero { opacity:0.3; }

/* FORMS */
.f-section { margin-bottom:14px; }
.f-section label { display:block; color:var(--dim); font-size:0.85em; margin-bottom:6px; }
.f-select, .f-input { width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:1em; margin-bottom:8px; }
.f-select option { background:var(--surface); }
.size-sell-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
.size-sell-btn { padding:10px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; cursor:pointer; text-align:center; font-size:0.9em; }
.size-sell-btn.selected { border-color:var(--accent); background:rgba(255,59,59,0.15); color:var(--accent); }
.size-sell-btn .avail { font-size:0.7em; color:var(--dim); display:block; }
.sell-qty { display:flex; align-items:center; gap:12px; justify-content:center; margin:12px 0; }
.sell-qty button { width:44px; height:44px; font-size:1.3em; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:6px; cursor:pointer; }
.sell-qty span { font-size:1.5em; min-width:40px; text-align:center; }
.price-row { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--border); margin-top:8px; }
.price-row .label { color:var(--dim); }
.price-row .val { font-weight:600; }
.discount-row { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
.disc-btn { flex:1; min-width:70px; padding:8px; background:var(--surface); border:1px solid var(--border); color:var(--dim); border-radius:6px; cursor:pointer; font-size:0.85em; text-align:center; }
.disc-btn.active { border-color:var(--yellow); color:var(--yellow); background:rgba(255,193,7,0.1); }
.action-btn { width:100%; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:1.1em; font-weight:600; cursor:pointer; margin-top:12px; }
.action-btn:disabled { opacity:0.4; cursor:default; }
.action-btn.secondary { background:var(--surface); border:1px solid var(--accent); color:var(--accent); }
.action-btn.blue { background:var(--blue); }
.custom-price-input { width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:1em; margin-top:8px; display:none; }

/* LOG */
.log-entry { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:6px; }
.log-top { display:flex; justify-content:space-between; align-items:center; }
.log-entry .info { font-size:0.9em; }
.log-entry .info .item-sold { font-weight:600; }
.log-entry .info .meta { color:var(--dim); font-size:0.8em; }
.log-entry .amount { font-weight:600; color:var(--green); }
.log-entry .amount.discount { color:var(--yellow); }
.log-entry .amount.voided { color:var(--accent); text-decoration:line-through; }
.log-entry.voided { opacity:0.5; }
.log-entry.addition { border-left:3px solid var(--blue); }
.log-entry .amount.cost { color:var(--accent2); }
.void-btn { background:none; border:1px solid var(--accent); color:var(--accent); padding:3px 8px; border-radius:4px; cursor:pointer; font-size:0.75em; margin-top:4px; }
.void-btn:hover { background:rgba(255,59,59,0.15); }
.day-total { background:var(--surface2); padding:12px; border-radius:8px; margin-bottom:16px; display:flex; justify-content:space-around; text-align:center; }
.day-total .stat-val { font-size:1.3em; font-weight:700; }
.day-total .stat-label { font-size:0.75em; color:var(--dim); }
.log-filter { display:flex; gap:8px; margin-bottom:12px; }
.log-filter button { padding:6px 12px; background:var(--surface); border:1px solid var(--border); color:var(--dim); border-radius:6px; cursor:pointer; font-size:0.85em; }
.log-filter button.active { color:var(--accent); border-color:var(--accent); }

/* STATS */
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:12px; }
.stat-card h3 { color:var(--accent2); font-size:0.9em; margin-bottom:10px; }
.stat-row { display:flex; justify-content:space-between; padding:4px 0; font-size:0.9em; }
.stat-row .label { color:var(--dim); }

/* SEARCH */
.search-box { width:100%; padding:10px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:1em; margin-bottom:12px; }

/* TOGGLE BTNS */
.toggle-row { display:flex; gap:8px; margin-bottom:16px; }
.toggle-btn { flex:1; padding:10px; background:var(--surface); border:1px solid var(--border); color:var(--dim); border-radius:6px; cursor:pointer; font-size:0.85em; text-align:center; }
.toggle-btn.active { color:var(--accent); border-color:var(--accent); }

/* TRANSFER */
.transfer-arrow { text-align:center; font-size:1.5em; color:var(--blue); margin:8px 0; }

/* SYNC INDICATOR */
.sync-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
.sync-dot.online { background:var(--green); }
.sync-dot.offline { background:var(--accent); }

.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:10px 20px; border-radius:8px; font-weight:600; z-index:999; display:none; max-width:90%; text-align:center; }

/* YEAR-END SUMMARY */
.year-summary-card {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  border: 2px solid var(--yellow);
  border-radius: 12px;
  padding: 20px;
  margin: 20px 0;
}
.year-summary-card h3 {
  color: var(--yellow);
  font-size: 1.2em;
  margin-bottom: 4px;
  text-align: center;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.year-summary-card .summary-subtitle {
  text-align: center;
  color: var(--dim);
  font-size: 0.8em;
  margin-bottom: 16px;
}
.year-summary-card .summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.year-summary-card .summary-stat {
  text-align: center;
  padding: 10px 6px;
  background: rgba(0,0,0,0.3);
  border-radius: 8px;
}
.year-summary-card .summary-stat .val {
  font-size: 1.3em;
  font-weight: 700;
}
.year-summary-card .summary-stat .val.green { color: var(--green); }
.year-summary-card .summary-stat .val.yellow { color: var(--yellow); }
.year-summary-card .summary-stat .label {
  font-size: 0.75em;
  color: var(--dim);
  margin-top: 2px;
}
.year-summary-card .summary-section {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.year-summary-card .summary-section h4 {
  color: var(--dim);
  font-size: 0.8em;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.year-summary-card .summary-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 0.85em;
}
.year-summary-card .summary-row .rank { color: var(--dim); margin-right: 6px; }
.year-summary-card .summary-row .qty { color: var(--accent2); }
.year-summary-card .summary-row .rev { color: var(--green); }
.year-summary-card .inv-snapshot {
  margin-top: 12px;
  padding: 10px;
  background: rgba(0,0,0,0.3);
  border-radius: 8px;
  text-align: center;
  font-size: 0.85em;
}
.year-summary-card .inv-snapshot .label { color: var(--dim); }

@media(max-width:400px) {
  .size-sell-grid { grid-template-columns:repeat(3,1fr); }
}
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div class="gate-screen" id="screen-password">
  <h1>ELBO ROOM</h1>
  <p style="color:var(--dim)">Enter Password</p>
  <input type="password" class="gate-input" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')pwSubmit()" />
  <div style="display:flex;align-items:center;gap:8px;margin:4px 0">
    <input type="checkbox" id="pw-remember" style="accent-color:var(--accent)">
    <label for="pw-remember" style="color:var(--dim);font-size:0.85em">Remember this device</label>
  </div>
  <button class="gate-btn" onclick="pwSubmit()">Enter</button>
  <div class="gate-error" id="pw-error"></div>
</div>

<!-- NAME SELECT -->
<div class="gate-screen" id="screen-name" style="display:none">
  <h1>ELBO ROOM</h1>
  <p style="color:var(--dim);margin-bottom:12px">Who's working?</p>
  <button class="name-btn" onclick="selectUser('Austin')">Austin</button>
  <button class="name-btn" onclick="selectUser('Elyse')">Elyse</button>
  <button class="name-btn" onclick="selectUser('Adam')">Adam</button>
  <button class="name-btn" onclick="selectUser('Cass')">Cass</button>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="top-bar">
    <div><span class="sync-dot" id="sync-dot"></span><span style="font-size:1em;color:var(--accent);font-weight:700">ELBO MERCH</span></div>
    <span class="user-badge" id="user-badge" onclick="switchUser()"></span>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="sell">Sell</div>
    <div class="tab" data-tab="inventory">Inventory</div>
    <div class="tab" data-tab="transfer">Transfer</div>
    <div class="tab" data-tab="log">Log</div>
    <div class="tab" data-tab="stats">Stats</div>
    <div class="tab" data-tab="manage">Manage</div>
  </div>

  <!-- SELL -->
  <div class="panel active" id="panel-sell">
    <div class="f-section">
      <label>Select Item</label>
      <select class="f-select" id="sell-item" onchange="onSellItemChange()">
        <option value="">-- Choose --</option>
      </select>
    </div>
    <div class="f-section" id="sell-size-section" style="display:none">
      <label>Select Size</label>
      <div class="size-sell-grid" id="sell-sizes"></div>
    </div>
    <div id="sell-details" style="display:none">
      <div class="sell-qty">
        <button onclick="adjQty(-1)">-</button>
        <span id="sell-qty-display">1</span>
        <button onclick="adjQty(1)">+</button>
      </div>
      <div class="discount-row">
        <div class="disc-btn active" data-disc="0" onclick="setDiscount(0)">Full Price</div>
        <div class="disc-btn" data-disc="0.5" onclick="setDiscount(0.5)">50% Off</div>
        <div class="disc-btn" data-disc="1" onclick="setDiscount(1)">Free</div>
        <div class="disc-btn" data-disc="custom" onclick="setDiscount('custom')">Custom</div>
      </div>
      <input type="number" class="custom-price-input" id="custom-price" placeholder="Enter custom price" oninput="updateSellTotal()" />
      <div class="price-row"><span class="label">Unit Price</span><span class="val" id="unit-price">$0</span></div>
      <div class="price-row"><span class="label">Total</span><span class="val" id="sell-total">$0</span></div>
      <div class="f-section" style="margin-top:8px">
        <label>Note (optional)</label>
        <input type="text" class="f-input" id="sell-note" placeholder="e.g. staff comp, promo..." style="margin-bottom:0" />
      </div>
      <button class="action-btn" id="record-btn" onclick="recordSale()">Record Sale</button>
    </div>
  </div>

  <!-- INVENTORY -->
  <div class="panel" id="panel-inventory">
    <input type="text" class="search-box" placeholder="Search items..." oninput="filterInventory(this.value)" />
    <div id="inventory-list"></div>
  </div>

  <!-- TRANSFER -->
  <div class="panel" id="panel-transfer">
    <p style="color:var(--dim);font-size:0.85em;margin-bottom:16px">Move items between locations without recording a sale.</p>
    <div class="f-section">
      <label>From</label>
      <select class="f-select" id="transfer-from" onchange="onTransferFromChange()">
        <option value="">-- Choose Location --</option>
        <option value="office">Office / Floor</option>
        <option value="storage">Storage Unit</option>
      </select>
    </div>
    <div class="f-section" id="transfer-to-section" style="display:none">
      <label>To</label>
      <select class="f-select" id="transfer-to" onchange="onTransferToChange()">
        <option value="">-- Choose Destination --</option>
        <option value="office">Office / Floor</option>
        <option value="storage">Storage Unit</option>
      </select>
    </div>
    <div class="f-section" id="transfer-item-section" style="display:none">
      <label>Select Item</label>
      <select class="f-select" id="transfer-item" onchange="onTransferItemChange()">
        <option value="">-- Choose --</option>
      </select>
    </div>
    <div id="transfer-size-section" style="display:none">
      <label style="color:var(--dim);font-size:0.85em;margin-bottom:6px;display:block">Select Size</label>
      <div class="size-sell-grid" id="transfer-sizes"></div>
    </div>
    <div id="transfer-qty-section" style="display:none">
      <div class="sell-qty">
        <button onclick="adjTransferQty(-1)">-</button>
        <span id="transfer-qty-display">1</span>
        <button onclick="adjTransferQty(1)">+</button>
      </div>
      <div class="transfer-arrow" id="transfer-direction"></div>
      <button class="action-btn blue" onclick="executeTransfer()">Transfer</button>
    </div>
  </div>

  <!-- LOG -->
  <div class="panel" id="panel-log">
    <div class="day-total" id="day-totals"></div>
    <div class="log-filter" id="log-filter">
      <button class="active" data-f="today" onclick="filterLog('today')">Today</button>
      <button data-f="week" onclick="filterLog('week')">This Week</button>
      <button data-f="month" onclick="filterLog('month')">Month</button>
      <button data-f="all" onclick="filterLog('all')">All</button>
      <span id="year-filters"></span>
    </div>
    <div id="log-list"></div>
  </div>

  <!-- STATS -->
  <div class="panel" id="panel-stats">
    <div id="stats-content"></div>
  </div>

  <!-- MANAGE -->
  <div class="panel" id="panel-manage">
    <div class="toggle-row">
      <div class="toggle-btn active" id="mg-btn-add" onclick="showManageSection('add')">Add New</div>
      <div class="toggle-btn" id="mg-btn-restock" onclick="showManageSection('restock')">Restock</div>
      <div class="toggle-btn" id="mg-btn-edit" onclick="showManageSection('edit')">Edit</div>
    </div>

    <div id="manage-add">
      <div class="f-section"><label>Item Name</label><input type="text" class="f-input" id="add-name" placeholder="e.g. Neon Pink Tee" /></div>
      <div class="f-section"><label>Category</label>
        <select class="f-select" id="add-type">
          <option value="tshirt">T-Shirt ($25)</option><option value="longsleeve">Long Sleeve ($40)</option>
          <option value="hoodie">Hoodie ($45)</option><option value="hat">Hat ($30)</option>
          <option value="crop">Crop Top ($25)</option><option value="jersey">Jersey ($25)</option>
        </select>
      </div>
      <div class="f-section"><label>Location</label>
        <select class="f-select" id="add-location"><option value="office">Office / Floor</option><option value="storage">Storage Unit</option></select>
      </div>
      <div class="f-section"><label>Our Cost ($)</label><input type="number" class="f-input" id="add-cost" placeholder="e.g. 10" /></div>
      <div class="f-section">
        <label>Sizes & Quantities</label>
        <p style="color:var(--dim);font-size:0.8em;margin-bottom:8px">Enter qty per size. Leave blank for sizes you don't carry.</p>
        <div id="add-sizes-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
        <div style="margin-top:8px">
          <input type="checkbox" id="add-onesize" style="accent-color:var(--accent)" onchange="renderAddSizes()">
          <label for="add-onesize" style="color:var(--dim);font-size:0.85em">One Size (hats)</label>
        </div>
      </div>
      <button class="action-btn" onclick="addNewItem()">Add Item</button>
    </div>

    <div id="manage-restock" style="display:none">
      <div class="f-section"><label>Select Item to Restock</label>
        <select class="f-select" id="restock-item" onchange="onRestockItemChange()"><option value="">-- Choose --</option></select>
      </div>
      <div id="restock-sizes" style="display:none">
        <div class="f-section"><label>Add quantities per size</label>
          <div id="restock-sizes-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
        </div>
        <button class="action-btn" onclick="restockItem()">Restock</button>
      </div>
    </div>

    <div id="manage-edit" style="display:none">
      <div class="f-section"><label>Select Item to Edit</label>
        <select class="f-select" id="edit-item" onchange="onEditItemChange()"><option value="">-- Choose --</option></select>
      </div>
      <div id="edit-fields" style="display:none">
        <div class="f-section"><label>Item Name</label><input type="text" class="f-input" id="edit-name" /></div>
        <div class="f-section"><label>Category</label>
          <select class="f-select" id="edit-type">
            <option value="tshirt">T-Shirt ($25)</option><option value="longsleeve">Long Sleeve ($40)</option>
            <option value="hoodie">Hoodie ($45)</option><option value="hat">Hat ($30)</option>
            <option value="crop">Crop Top ($25)</option><option value="jersey">Jersey ($25)</option>
          </select>
        </div>
        <div class="f-section"><label>Location</label>
          <select class="f-select" id="edit-location"><option value="office">Office / Floor</option><option value="storage">Storage Unit</option></select>
        </div>
        <button class="action-btn" onclick="saveEditItem()">Save Changes</button>
        <button class="action-btn secondary" style="margin-top:8px" onclick="deleteItem()">Delete Item</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

  projectId: "elbo-merch",
  storageBucket: "elbo-merch.firebasestorage.app",
  messagingSenderId: "288648973262",
  appId: "1:288648973262:web:213e825e55b62da33f399f"
});
const db = firebase.database();

// ============ PRICING ============
const PRICING = {
  tshirt: { retail: 25, category: 'T-Shirts' },
  longsleeve: { retail: 40, category: 'Long Sleeves' },
  hoodie: { retail: 45, category: 'Hoodies' },

const COST = { neon:10, camo:16, hat:12, hoodie:17, default:12 };

// ============ INITIAL INVENTORY ============

// ============ PASSWORD ============
const PW_HASH = 'e7538fe100cdd27b801a796e5c4603b344c8a1c293e2446511c144c399a369d8';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function pwSubmit() {
  const hash = await sha256(document.getElementById('pw-input').value);
  if (hash === PW_HASH) {
    if (document.getElementById('pw-remember').checked) localStorage.setItem('elbo-pw-ok', hash);
    document.getElementById('screen-password').style.display = 'none';
    document.getElementById('screen-name').style.display = 'flex';
  } else {
    document.getElementById('pw-error').textContent = 'Wrong password';
    document.getElementById('pw-input').value = '';
  }
}

  document.getElementById('user-badge').textContent = name + ' ▾';

}

// ============ FIREBASE SYNC ============
function bootApp() {
  if (dbReady) return;
  dbReady = true;

  // Sync indicator
  const dot = document.getElementById('sync-dot');
  db.ref('.info/connected').on('value', snap => {
    dot.className = 'sync-dot ' + (snap.val() ? 'online' : 'offline');
  });

  // Check if inventory exists in Firebase
  db.ref('inventory').once('value', snap => {
    if (!snap.exists()) {
      // First run: seed with initial inventory
      db.ref('inventory').set(INIT_INVENTORY);
    }
  });

  // Listen for inventory changes (real-time)
  db.ref('inventory').on('value', snap => {
    inventory = snap.val() || {};
    renderAll();
  });

  // Listen for sales changes (real-time)
  db.ref('sales').on('value', snap => {
    const data = snap.val() || {};
    salesLog = Object.entries(data).map(([k,v]) => ({...v, _key:k})).sort((a,b) => b.ts - a.ts);
    renderLog();
    renderStats();
    updateYearFilters();
    // Auto-generate year-end summary if a year boundary has passed
    setTimeout(checkAutoSummary, 2000);
  });

  // Listen for yearly summaries
  db.ref('yearly-summaries').on('value', snap => {
    yearlySummaries = snap.val() || {};
    renderLog();
    updateYearFilters();
  });
}

// ============ SELL ============
function populateSellDropdown() {
  const sel = document.getElementById('sell-item');
  const prev = sel.value;
  sel.innerHTML = '<option value="">-- Choose Item --</option>';
  const grouped = {};
  Object.entries(inventory).forEach(([id, item]) => {
    const cat = PRICING[item.type]?.category || 'Other';
    const loc = item.location === 'storage' ? ' [Storage]' : '';
    if (!grouped[cat]) grouped[cat] = [];
    const total = Object.values(item.sizes||{}).reduce((a,b) => a+b, 0);
    if (total > 0) grouped[cat].push({ id, name: item.name + loc, total });
  });
  Object.keys(grouped).sort().forEach(cat => {
    const og = document.createElement('optgroup');
    og.label = cat;
    grouped[cat].forEach(i => {
      const o = document.createElement('option');
      o.value = i.id;
      o.textContent = `${i.name} (${i.total})`;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  if (prev) sel.value = prev;
}

function onSellItemChange() {
  const id = document.getElementById('sell-item').value;
  sellState = { itemId:id, size:null, qty:1, discount:0 };
  if (!id) { hide('sell-size-section'); hide('sell-details'); return; }
  const item = inventory[id];
  const grid = document.getElementById('sell-sizes');
  grid.innerHTML = '';
  Object.entries(item.sizes||{}).forEach(([sz, ct]) => {
    const btn = document.createElement('div');
    btn.className = 'size-sell-btn' + (ct===0?' zero':'');
    btn.innerHTML = `${sz}<span class="avail">${ct} left</span>`;
    if (ct > 0) btn.onclick = () => selectSellSize(sz);
    btn.dataset.sz = sz;
    grid.appendChild(btn);
  });
  show('sell-size-section'); hide('sell-details');
}

function selectSellSize(sz) {
  sellState.size = sz; sellState.qty = 1; sellState.discount = 0;
  document.querySelectorAll('#sell-sizes .size-sell-btn').forEach(b => b.classList.toggle('selected', b.dataset.sz===sz));
  document.querySelectorAll('.disc-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.disc-btn[data-disc="0"]').classList.add('active');
  document.getElementById('custom-price').style.display = 'none';
  show('sell-details'); updateSellTotal();
}

function adjQty(d) {
  const max = (inventory[sellState.itemId]?.sizes||{})[sellState.size] || 0;
  sellState.qty = Math.max(1, Math.min(max, sellState.qty + d));
  updateSellTotal();
}

function setDiscount(d) {
  sellState.discount = d;
  document.querySelectorAll('.disc-btn').forEach(b => b.classList.remove('active'));
  if (d === 'custom') {
    document.querySelector('.disc-btn[data-disc="custom"]').classList.add('active');
    document.getElementById('custom-price').style.display = 'block';
    document.getElementById('custom-price').focus();
  } else {
    document.querySelector(`.disc-btn[data-disc="${d}"]`).classList.add('active');
    document.getElementById('custom-price').style.display = 'none';
  }
  updateSellTotal();
}

function getSellPrice() {
  if (sellState.discount === 'custom') return parseFloat(document.getElementById('custom-price').value) || 0;
  const retail = PRICING[inventory[sellState.itemId]?.type]?.retail || 25;
  return retail * (1 - sellState.discount);
}

function updateSellTotal() {
  const p = getSellPrice();
  document.getElementById('sell-qty-display').textContent = sellState.qty;
  document.getElementById('unit-price').textContent = '$' + p.toFixed(0);
  document.getElementById('sell-total').textContent = '$' + (p * sellState.qty).toFixed(0);
}

function recordSale() {
  const item = inventory[sellState.itemId];
  if (!item || !sellState.size) return;
  const avail = (item.sizes||{})[sellState.size] || 0;
  if (sellState.qty > avail) { showToast('Not enough stock!'); return; }

  const price = getSellPrice();
  const costKey = item.costKey === 'custom' ? 'custom-'+sellState.itemId : (item.costKey || 'default');
  const cost = COST[costKey] || COST.default;

  const sale = {
    ts: Date.now(),
    itemId: sellState.itemId,
    itemName: item.name,
    type: item.type,
    location: item.location,
    size: sellState.size,
    qty: sellState.qty,
    unitPrice: price,
    total: price * sellState.qty,
    cost: cost * sellState.qty,
    discount: sellState.discount === 'custom' ? 'custom' : (sellState.discount * 100) + '%',
    note: document.getElementById('sell-note').value.trim(),
    user: currentUser,
    voided: false
  };

  // Update Firebase
  const newQty = avail - sellState.qty;
  db.ref(`inventory/${sellState.itemId}/sizes/${sellState.size}`).set(newQty);
  db.ref('sales').push(sale);

  showToast(`Sold ${sellState.qty}x ${item.name} (${sellState.size}) - $${sale.total}`);

  // Reset
  document.getElementById('sell-item').value = '';
  hide('sell-size-section'); hide('sell-details');
  document.getElementById('sell-note').value = '';
  sellState = { itemId:null, size:null, qty:1, discount:0 };
}

// ============ VOID SALE ============
function voidSale(key) {
  if (!confirm('Are you sure you want to void this sale? This will restore the inventory and cannot be easily undone.')) return;
  if (!confirm('Void this sale? Inventory will be restored.')) return;
  const sale = salesLog.find(s => s._key === key);
  if (!sale || sale.voided) return;

  // Restore inventory
  const currentQty = (inventory[sale.itemId]?.sizes||{})[sale.size] || 0;
  db.ref(`inventory/${sale.itemId}/sizes/${sale.size}`).set(currentQty + sale.qty);
  db.ref(`sales/${key}/voided`).set(true);
  db.ref(`sales/${key}/voidedBy`).set(currentUser);
  db.ref(`sales/${key}/voidedAt`).set(Date.now());

  showToast('Sale voided, inventory restored');
}

function onTransferToChange() {
  const from = document.getElementById('transfer-from').value;
  const to = document.getElementById('transfer-to').value;
  transferState.to = to;
  transferState.itemId = null; transferState.size = null; transferState.qty = 1;
  const sel = document.getElementById('transfer-item');
  sel.innerHTML = '<option value="">-- Choose --</option>';
  if (!to) { hide('transfer-item-section'); hide('transfer-size-section'); hide('transfer-qty-section'); return; }
  if (to === from) { showToast('From and To cannot be the same'); hide('transfer-item-section'); return; }

  Object.entries(inventory).filter(([_,i]) => i.location === from).sort((a,b) => a[1].name.localeCompare(b[1].name)).forEach(([id, item]) => {
    const total = Object.values(item.sizes||{}).reduce((a,b) => a+b, 0);
    if (total > 0) {
      const o = document.createElement('option');
      o.value = id; o.textContent = `${item.name} (${total})`;
      sel.appendChild(o);
    }
  });
  show('transfer-item-section');
  hide('transfer-size-section'); hide('transfer-qty-section');
}

function onTransferItemChange() {
  const id = document.getElementById('transfer-item').value;
  transferState.itemId = id; transferState.size = null; transferState.qty = 1;
  if (!id) { hide('transfer-size-section'); hide('transfer-qty-section'); return; }
  const item = inventory[id];
  const grid = document.getElementById('transfer-sizes');
  grid.innerHTML = '';
  Object.entries(item.sizes||{}).forEach(([sz, ct]) => {
    const btn = document.createElement('div');
    btn.className = 'size-sell-btn' + (ct===0?' zero':'');
    btn.innerHTML = `${sz}<span class="avail">${ct} here</span>`;
    if (ct > 0) btn.onclick = () => selectTransferSize(sz);
    btn.dataset.sz = sz;
    grid.appendChild(btn);
  });
  show('transfer-size-section'); hide('transfer-qty-section');
}

function selectTransferSize(sz) {
  transferState.size = sz; transferState.qty = 1;
  document.querySelectorAll('#transfer-sizes .size-sell-btn').forEach(b => b.classList.toggle('selected', b.dataset.sz===sz));
  const locNames = { office:'Office / Floor', storage:'Storage Unit' };
  const src = locNames[transferState.from] || transferState.from;
  const dest = locNames[transferState.to] || transferState.to;
  document.getElementById('transfer-direction').textContent = `${src} → ${dest}`;
  document.getElementById('transfer-qty-display').textContent = '1';
  show('transfer-qty-section');
}

function adjTransferQty(d) {
  const max = (inventory[transferState.itemId]?.sizes||{})[transferState.size] || 0;
  transferState.qty = Math.max(1, Math.min(max, transferState.qty + d));
  document.getElementById('transfer-qty-display').textContent = transferState.qty;
}

function executeTransfer() {
  const { from, to, itemId, size, qty } = transferState;
  if (!itemId || !size || !to) return;
  const item = inventory[itemId];
  const avail = (item.sizes||{})[size] || 0;
  if (qty > avail) { showToast('Not enough stock!'); return; }

  const destLoc = to;

  // Find matching item in destination, or create one
  let destId = Object.entries(inventory).find(([id, i]) =>
    i.name === item.name && i.type === item.type && i.location === destLoc
  )?.[0];

  const updates = {};
  updates[`inventory/${itemId}/sizes/${size}`] = avail - qty;

  if (destId) {
    const destQty = (inventory[destId].sizes||{})[size] || 0;
    updates[`inventory/${destId}/sizes/${size}`] = destQty + qty;
  } else {
    // Create new item at destination
    destId = 'transfer-' + Date.now();
    const newItem = { ...item, location: destLoc, sizes: { [size]: qty } };
    delete newItem._key;
    updates[`inventory/${destId}`] = newItem;
  }

  // Log the transfer
  const locNames = { office:'Office / Floor', storage:'Storage Unit' };
  updates['transfers/' + Date.now()] = {
    ts: Date.now(),
    itemName: item.name,
    size, qty,
    from, to: destLoc,
    user: currentUser
  };

  db.ref().update(updates);
  showToast(`Transferred ${qty}x ${item.name} (${size}) → ${locNames[destLoc] || destLoc}`);

  // Reset
  document.getElementById('transfer-from').value = '';
  document.getElementById('transfer-to').value = '';
  document.getElementById('transfer-item').innerHTML = '<option value="">-- Choose --</option>';
  hide('transfer-to-section'); hide('transfer-item-section'); hide('transfer-size-section'); hide('transfer-qty-section');
  transferState = { from:null, to:null, itemId:null, size:null, qty:1 };
}

// ============ INVENTORY ============
function renderInventory(filter = '') {
  const container = document.getElementById('inventory-list');
  const f = filter.toLowerCase();
  let html = '';
  ['office','storage'].forEach(loc => {
    const locItems = Object.entries(inventory).filter(([_,i]) => i.location === loc);
    if (!locItems.length) return;
    html += `<div class="category-header" style="font-size:1.3em;color:var(--blue);margin-top:16px">${loc==='office'?'Office / Floor':'Storage Unit'}</div>`;
    const types = {};
    locItems.forEach(([id,item]) => {
      const cat = PRICING[item.type]?.category || 'Other';
      if (!types[cat]) types[cat] = [];
      types[cat].push([id,item]);
    });
    Object.keys(types).sort().forEach(cat => {
      const items = types[cat].filter(([_,i]) => !f || i.name.toLowerCase().includes(f));
      if (!items.length) return;
      html += `<div class="category-header">${cat}</div>`;
      items.forEach(([id,item]) => {
        const total = Object.values(item.sizes||{}).reduce((a,b) => a+b, 0);
        html += `<div class="item-card"><div class="item-name"><span>${item.name}</span><span class="item-total">${total} units</span></div>
          <div class="size-grid">${Object.entries(item.sizes||{}).map(([sz,ct]) =>
            `<div class="size-chip${ct===0?' zero':''}"><span class="sz">${sz}</span> <span class="ct">${ct}</span></div>`
          ).join('')}</div></div>`;
      });
    });
  });
  container.innerHTML = html || '<p style="color:var(--dim);text-align:center;padding:40px">No items found</p>';
}

function filterInventory(val) { renderInventory(val); }

// ============ LOG ============
let logPeriod = 'today';
function localDateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function renderLog() {
  const now = new Date();
  const todayStr = localDateStr(now);
  const weekAgo = new Date(now - 7*86400000);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

  let filtered = salesLog;
  if (logPeriod === 'today') filtered = salesLog.filter(s => localDateStr(new Date(s.ts)) === todayStr);
  else if (logPeriod === 'week') filtered = salesLog.filter(s => new Date(s.ts) >= weekAgo);
  else if (logPeriod === 'month') filtered = salesLog.filter(s => new Date(s.ts) >= monthStart);
  else if (logPeriod.startsWith('year-')) {
    const yr = parseInt(logPeriod.slice(5));
    const ys = new Date(yr, 0, 1).getTime(), ye = new Date(yr+1, 0, 1).getTime();
    filtered = salesLog.filter(s => s.ts >= ys && s.ts < ye);
  }

  // Merge yearly summaries into the display list
  let combined = filtered.map(s => ({...s, _type: 'sale'}));
  Object.values(yearlySummaries).forEach(summary => {
    if (!summary || !summary.ts) return;
    let include = false;
    if (logPeriod === 'all') include = true;
    else if (logPeriod === 'month') include = new Date(summary.ts) >= monthStart;
    else if (logPeriod === 'week') include = new Date(summary.ts) >= weekAgo;
    else if (logPeriod === 'today') include = localDateStr(new Date(summary.ts)) === todayStr;
    else if (logPeriod.startsWith('year-')) include = summary.year === parseInt(logPeriod.slice(5));
    if (include) combined.push({...summary, _type: 'year-summary'});
  });
  combined.sort((a, b) => (b.ts || 0) - (a.ts || 0));

  const active = filtered.filter(s => !s.voided && !s.action);
  const totalRev = active.reduce((a,s) => a + s.total, 0);
  const totalCost = active.reduce((a,s) => a + (s.cost||0), 0);
  const totalItems = active.reduce((a,s) => a + s.qty, 0);

  document.getElementById('day-totals').innerHTML = `
    <div><div class="stat-val">${totalItems}</div><div class="stat-label">Items Sold</div></div>
    <div><div class="stat-val">$${totalRev.toFixed(0)}</div><div class="stat-label">Revenue</div></div>
    <div><div class="stat-val" style="color:var(--green)">$${(totalRev-totalCost).toFixed(0)}</div><div class="stat-label">Profit</div></div>`;

  const list = document.getElementById('log-list');
  if (!combined.length) { list.innerHTML = '<p style="color:var(--dim);text-align:center;padding:40px">No sales recorded</p>'; return; }
  list.innerHTML = combined.map(s => {
    // Year-end summary card
    if (s._type === 'year-summary') return renderYearSummaryHTML(s);

    const time = new Date(s.ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
    const date = new Date(s.ts).toLocaleDateString([], {month:'short',day:'numeric'});
    const v = s.voided;

    // Inventory addition or restock
    if (s.action === 'added' || s.action === 'restock') {
      const label = s.action === 'added' ? 'NEW PRODUCT' : 'RESTOCK';
      const locName = s.location === 'storage' ? 'Storage' : 'Office';
      return `<div class="log-entry addition">
        <div class="log-top">
          <div class="info">
            <div class="item-sold">${label}: ${s.itemName}</div>
            <div class="meta">${date} ${time} by ${s.user} — +${s.qty} units (${s.sizeBreakdown}) → ${locName}</div>
          </div>
          <div class="amount cost">-$${(s.totalCost||0).toFixed(0)}</div>
        </div>
      </div>`;
    }

    // Regular sale
    const isDisc = s.discount !== '0%' && s.discount !== 0;
    return `<div class="log-entry${v?' voided':''}">
      <div class="log-top">
        <div class="info">
          <div class="item-sold">${s.qty}x ${s.itemName} (${s.size})</div>
          <div class="meta">${date} ${time} by ${s.user}${s.note?' — '+s.note:''}${isDisc?' ['+s.discount+' off]':''}${v?' — VOIDED by '+s.voidedBy:''}</div>
        </div>
        <div class="amount${isDisc?' discount':''}${v?' voided':''}">$${s.total.toFixed(0)}</div>
      </div>
      ${!v ? `<button class="void-btn" onclick="voidSale('${s._key}')">Void Sale</button>` : ''}
    </div>`;
  }).join('');
}

function filterLog(period) {
  logPeriod = period;
  document.querySelectorAll('#log-filter button').forEach(b => b.classList.toggle('active', b.dataset.f===period));
  renderLog();
}

// ============ YEAR-END SUMMARIES ============
function generateYearlySummary(year) {
  const yearStart = new Date(year, 0, 1).getTime();
  const yearEnd = new Date(year + 1, 0, 1).getTime();

  const yearSales = salesLog.filter(s =>
    s.ts >= yearStart && s.ts < yearEnd && !s.voided && !s.action
  );
  if (!yearSales.length) { showToast('No sales data for ' + year); return null; }

  const totalUnits = yearSales.reduce((a, s) => a + s.qty, 0);
  const totalRevenue = yearSales.reduce((a, s) => a + s.total, 0);
  const totalCost = yearSales.reduce((a, s) => a + (s.cost || 0), 0);
  const profit = totalRevenue - totalCost;
  const margin = totalRevenue > 0 ? (profit / totalRevenue * 100) : 0;

  // Top sellers
  const itemCounts = {};
  const itemRevenue = {};
  yearSales.forEach(s => {
    itemCounts[s.itemName] = (itemCounts[s.itemName] || 0) + s.qty;
    itemRevenue[s.itemName] = (itemRevenue[s.itemName] || 0) + s.total;
  });
  const topSellers = Object.entries(itemCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([name, qty]) => ({ name, qty, revenue: itemRevenue[name] || 0 }));

  // Category breakdown
  const catCounts = {};
  const catRevenue = {};
  yearSales.forEach(s => {
    const cat = PRICING[s.type]?.category || 'Other';
    catCounts[cat] = (catCounts[cat] || 0) + s.qty;
    catRevenue[cat] = (catRevenue[cat] || 0) + s.total;
  });
  const categories = Object.entries(catCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, qty]) => ({ cat, qty, revenue: catRevenue[cat] || 0 }));

  // Discounts
  const discounted = yearSales.filter(s => s.discount !== '0%' && s.discount !== 0);
  const discountCount = discounted.length;
  const discountValue = discounted.reduce((a, s) => {
    return a + ((PRICING[s.type]?.retail || 25) * s.qty - s.total);
  }, 0);

  // Restocks during the year
  const yearRestocks = salesLog.filter(s =>
    s.ts >= yearStart && s.ts < yearEnd && (s.action === 'added' || s.action === 'restock')
  );
  const restockUnits = yearRestocks.reduce((a, s) => a + s.qty, 0);
  const restockCost = yearRestocks.reduce((a, s) => a + (s.totalCost || 0), 0);

  // Inventory snapshot at time of generation
  let invUnits = 0, invRetail = 0, invCost = 0;
  Object.entries(inventory).forEach(([id, item]) => {
    const units = Object.values(item.sizes || {}).reduce((a, b) => a + b, 0);
    const retail = PRICING[item.type]?.retail || 25;
    const ck = item.costKey === 'custom' ? 'custom-' + id : (item.costKey || 'default');
    const cost = COST[ck] || COST.default;
    invUnits += units;
    invRetail += units * retail;
    invCost += units * cost;
  });

  const summary = {
    year,
    generatedAt: Date.now(),
    ts: new Date(year, 11, 31, 23, 59, 59).getTime(),
    totalUnitsSold: totalUnits,
    totalRevenue,
    totalCost,
    profit,
    margin: Math.round(margin * 10) / 10,
    topSellers,
    categories,
    discountCount,
    discountValue: Math.round(discountValue),
    restockUnits,
    restockCost,
    endingInventory: { units: invUnits, retailValue: invRetail, costBasis: invCost },
    totalTransactions: yearSales.length
  };

  db.ref(`yearly-summaries/${year}`).set(summary);
  showToast(year + ' Year-End Summary saved');
  return summary;
}

function checkAutoSummary() {
  const now = new Date();
  const currentYear = now.getFullYear();
  const prevYear = currentYear - 1;
  // Only auto-generate if previous year has sales but no summary yet
  if (yearlySummaries[prevYear]) return;
  const yearStart = new Date(prevYear, 0, 1).getTime();
  const yearEnd = new Date(currentYear, 0, 1).getTime();
  const prevSales = salesLog.filter(s => s.ts >= yearStart && s.ts < yearEnd && !s.voided && !s.action);
  if (prevSales.length > 0) {
    generateYearlySummary(prevYear);
  }
}

      `<div class="summary-row"><span>${c.cat}</span><span><span class="qty">${c.qty} sold</span> &mdash; <span class="rev">$${c.revenue.toLocaleString()}</span></span></div>`
    ).join('');
  }

  return `<div class="year-summary-card">
    <h3>${s.year} Year in Review</h3>
    <div class="summary-subtitle">Generated ${genDate}</div>
    <div class="summary-grid">
      <div class="summary-stat"><div class="val">${s.totalUnitsSold.toLocaleString()}</div><div class="label">Items Sold</div></div>
      <div class="summary-stat"><div class="val">$${s.totalRevenue.toLocaleString()}</div><div class="label">Revenue</div></div>
      <div class="summary-stat"><div class="val green">$${s.profit.toLocaleString()}</div><div class="label">Profit</div></div>
      <div class="summary-stat"><div class="val yellow">${s.margin}%</div><div class="label">Margin</div></div>
    </div>
    <div class="summary-grid">
      <div class="summary-stat"><div class="val">${s.totalTransactions}</div><div class="label">Transactions</div></div>
      <div class="summary-stat"><div class="val">${s.discountCount}</div><div class="label">Discounted</div></div>
    </div>
    ${topHtml ? `<div class="summary-section"><h4>Top Sellers</h4>${topHtml}</div>` : ''}
    ${catHtml ? `<div class="summary-section"><h4>By Category</h4>${catHtml}</div>` : ''}
    ${s.restockUnits ? `<div class="summary-section"><h4>Restocks</h4><div class="summary-row"><span>Units Added</span><span class="qty">${s.restockUnits.toLocaleString()}</span></div><div class="summary-row"><span>Restock Cost</span><span>$${s.restockCost.toLocaleString()}</span></div></div>` : ''}
    ${s.discountValue ? `<div class="summary-section"><h4>Discounts / Comps</h4><div class="summary-row"><span>Revenue Discounted</span><span style="color:var(--yellow)">$${s.discountValue.toLocaleString()}</span></div></div>` : ''}
    <div class="inv-snapshot">
      <div class="label">Ending Inventory</div>
      <div>${s.endingInventory.units.toLocaleString()} units &mdash; $${s.endingInventory.retailValue.toLocaleString()} retail &mdash; $${s.endingInventory.costBasis.toLocaleString()} cost</div>
    </div>
  </div>`;
}

function updateYearFilters() {
  const years = new Set();
  salesLog.forEach(s => years.add(new Date(s.ts).getFullYear()));
  Object.keys(yearlySummaries).forEach(y => years.add(parseInt(y)));
  const container = document.getElementById('year-filters');
  if (!container) return;
  if (years.size <= 1 && !Object.keys(yearlySummaries).length) { container.innerHTML = ''; return; }
  container.innerHTML = [...years].sort((a,b) => b-a).map(y =>
    `<button data-f="year-${y}" onclick="filterLog('year-${y}')"${logPeriod==='year-'+y?' class="active"':''}>${y}</button>`
  ).join('');
}

// ============ STATS ============
function renderStats() {
  const now = new Date();
  const monthStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const activeSales = salesLog.filter(s => !s.voided);
  const monthSales = activeSales.filter(s => { const d=new Date(s.ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')===monthStr; });

  const itemCounts = {};
  activeSales.forEach(s => { itemCounts[s.itemName] = (itemCounts[s.itemName]||0) + s.qty; });
  const topSellers = Object.entries(itemCounts).sort((a,b) => b[1]-a[1]).slice(0,5);

  let totalUnits=0, totalRetail=0, totalCostVal=0;
  Object.entries(inventory).forEach(([id, item]) => {
    const units = Object.values(item.sizes||{}).reduce((a,b) => a+b, 0);
    const retail = PRICING[item.type]?.retail || 25;
    const ck = item.costKey === 'custom' ? 'custom-'+id : (item.costKey || 'default');
    const cost = COST[ck] || COST.default;
    totalUnits += units; totalRetail += units*retail; totalCostVal += units*cost;
  });

  const mRev = monthSales.reduce((a,s) => a+s.total, 0);
  const mCost = monthSales.reduce((a,s) => a+(s.cost||0), 0);

  let html = `<div class="stat-card"><h3>Inventory Overview</h3>
    <div class="stat-row"><span class="label">Total Units</span><span>${totalUnits.toLocaleString()}</span></div>
    <div class="stat-row"><span class="label">Retail Value</span><span>$${totalRetail.toLocaleString()}</span></div>
    <div class="stat-row"><span class="label">Cost Basis</span><span>$${totalCostVal.toLocaleString()}</span></div>
    <div class="stat-row"><span class="label">Potential Profit</span><span style="color:var(--green)">$${(totalRetail-totalCostVal).toLocaleString()}</span></div></div>`;

  html += `<div class="stat-card"><h3>This Month</h3>
    <div class="stat-row"><span class="label">Items Sold</span><span>${monthSales.reduce((a,s)=>a+s.qty,0)}</span></div>
    <div class="stat-row"><span class="label">Revenue</span><span>$${mRev.toFixed(0)}</span></div>
    <div class="stat-row"><span class="label">Profit</span><span style="color:var(--green)">$${(mRev-mCost).toFixed(0)}</span></div>
    <div class="stat-row"><span class="label">Margin</span><span>${mRev>0?((mRev-mCost)/mRev*100).toFixed(0):0}%</span></div></div>`;

  if (topSellers.length) {
    html += `<div class="stat-card"><h3>Top Sellers (All Time)</h3>`;
    topSellers.forEach(([n,c]) => { html += `<div class="stat-row"><span class="label">${n}</span><span>${c} sold</span></div>`; });
    html += `</div>`;
  }

  const voided = salesLog.filter(s => s.voided);
  if (voided.length) {
    const lostRev = voided.reduce((a,s) => a+s.total, 0);
    html += `<div class="stat-card"><h3>Voided Sales</h3>
      <div class="stat-row"><span class="label">Total Voided</span><span>${voided.length}</span></div>
      <div class="stat-row"><span class="label">Value Voided</span><span style="color:var(--accent)">$${lostRev.toFixed(0)}</span></div></div>`;
  }

  const discounted = activeSales.filter(s => s.discount !== '0%' && s.discount !== 0);
  if (discounted.length) {
    const lostRev = discounted.reduce((a,s) => {
      return a + ((PRICING[s.type]?.retail||25)*s.qty - s.total);
    }, 0);
    html += `<div class="stat-card"><h3>Discounts / Comps</h3>
      <div class="stat-row"><span class="label">Discounted Sales</span><span>${discounted.length}</span></div>
      <div class="stat-row"><span class="label">Revenue Lost</span><span style="color:var(--yellow)">$${lostRev.toFixed(0)}</span></div></div>`;
  }

  // Year-end summary section
  const currentYear = now.getFullYear();
  const yearsWithSales = [...new Set(salesLog.map(s => new Date(s.ts).getFullYear()))].sort((a,b) => b-a);
  const summaryBtns = yearsWithSales.map(y => {
    const exists = yearlySummaries[y];
    if (exists) {
      const genDate = new Date(exists.generatedAt).toLocaleDateString([], {month:'short', day:'numeric'});
      return `<div class="stat-row"><span class="label">${y}</span><span style="color:var(--green)">Generated ${genDate}</span></div>`;
    } else {
      return `<div class="stat-row"><span class="label">${y}</span><button onclick="generateYearlySummary(${y})" style="padding:4px 12px;background:var(--yellow);color:#000;border:none;border-radius:4px;cursor:pointer;font-size:0.85em">Generate Summary</button></div>`;
    }
  }).join('');
  if (summaryBtns) {
    html += `<div class="stat-card"><h3>Year-End Summaries</h3>${summaryBtns}<p style="color:var(--dim);font-size:0.75em;margin-top:8px">Summaries auto-generate when a new year starts. Use buttons above to generate manually.</p></div>`;
  }

  document.getElementById('stats-content').innerHTML = html;
}

// ============ MANAGE ============
const ALL_SIZES = ['XS','S','M','L','XL','XXL','XXXL','XXXXL'];

function showManageSection(s) {
  ['add','restock','edit'].forEach(x => {
    document.getElementById('manage-'+x).style.display = x===s?'block':'none';
    document.getElementById('mg-btn-'+x).classList.toggle('active', x===s);
  });
  if (s==='restock') populateRestockDropdown();
  if (s==='edit') populateEditDropdown();
}

function renderAddSizes() {
  const grid = document.getElementById('add-sizes-grid');
  const oneSize = document.getElementById('add-onesize').checked;
  if (oneSize) {
    grid.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><span style="color:var(--dim);min-width:35px">OS</span><input type="number" class="f-input" data-sz="OS" placeholder="0" style="margin:0" /></div>`;
  } else {
    grid.innerHTML = ALL_SIZES.map(sz => `<div style="display:flex;align-items:center;gap:8px"><span style="color:var(--dim);min-width:40px">${sz}</span><input type="number" class="f-input" data-sz="${sz}" placeholder="0" style="margin:0" /></div>`).join('');
  }
}

function addNewItem() {
  const name = document.getElementById('add-name').value.trim();
  if (!name) { showToast('Enter an item name'); return; }
  const type = document.getElementById('add-type').value;
  const location = document.getElementById('add-location').value;
  const costVal = parseFloat(document.getElementById('add-cost').value) || COST.default;

  const sizes = {};
  document.querySelectorAll('#add-sizes-grid input[data-sz]').forEach(inp => {
    const qty = parseInt(inp.value) || 0;
    if (qty > 0) sizes[inp.dataset.sz] = qty;
  });
  if (!Object.keys(sizes).length) { showToast('Add at least one size with quantity'); return; }

  const id = 'item-' + Date.now();
  db.ref(`inventory/${id}`).set({ name, type, location, costKey:'custom', sizes });
  db.ref(`customCosts/${id}`).set(costVal);
  COST['custom-'+id] = costVal;

  // Log the addition
  const totalQty = Object.values(sizes).reduce((a,b) => a+b, 0);
  const sizeList = Object.entries(sizes).map(([sz,q]) => `${sz}:${q}`).join(', ');
  db.ref('sales').push({
    ts: Date.now(),
    action: 'added',
    itemId: id,
    itemName: name,
    type,
    location,
    qty: totalQty,
    sizeBreakdown: sizeList,
    unitCost: costVal,
    totalCost: costVal * totalQty,
    total: 0,
    cost: costVal * totalQty,
    user: currentUser,
    voided: false
  });

  showToast(`Added: ${name}`);
  document.getElementById('add-name').value = '';
  document.getElementById('add-cost').value = '';
  renderAddSizes();
}

function populateRestockDropdown() {
  const sel = document.getElementById('restock-item');
  sel.innerHTML = '<option value="">-- Choose --</option>';
  Object.entries(inventory).sort((a,b) => a[1].name.localeCompare(b[1].name)).forEach(([id,item]) => {
    const loc = item.location==='storage'?' [Storage]':'';
    const o = document.createElement('option');
    o.value = id; o.textContent = item.name + loc;
    sel.appendChild(o);
  });
}

function onRestockItemChange() {
  const id = document.getElementById('restock-item').value;
  if (!id) { hide('restock-sizes'); return; }
  const item = inventory[id];
  const grid = document.getElementById('restock-sizes-grid');
  const hasSizes = Object.keys(item.sizes||{});
  const sizesToShow = hasSizes.includes('OS') ? ['OS'] : ALL_SIZES;
  grid.innerHTML = sizesToShow.map(sz => {
    const cur = (item.sizes||{})[sz] || 0;
    return `<div style="display:flex;align-items:center;gap:8px"><span style="color:var(--dim);min-width:40px">${sz}</span><input type="number" class="f-input" data-sz="${sz}" placeholder="+0" style="margin:0" /><span style="color:var(--dim);font-size:0.8em">(${cur})</span></div>`;
  }).join('');
  show('restock-sizes');
}

function restockItem() {
  const id = document.getElementById('restock-item').value;
  if (!id) return;
  const item = inventory[id];
  const updates = {};
  let added = 0;
  document.querySelectorAll('#restock-sizes-grid input[data-sz]').forEach(inp => {
    const qty = parseInt(inp.value) || 0;
    if (qty > 0) {
      const cur = (item.sizes||{})[inp.dataset.sz] || 0;
      updates[`inventory/${id}/sizes/${inp.dataset.sz}`] = cur + qty;
      added += qty;
    }
  });
  if (!added) { showToast('Enter quantities to add'); return; }
  db.ref().update(updates);

  // Log the restock
  const ck = item.costKey === 'custom' ? 'custom-'+id : (item.costKey || 'default');
  const unitCost = COST[ck] || COST.default;
  const sizeList = [];
  document.querySelectorAll('#restock-sizes-grid input[data-sz]').forEach(inp => {
    const qty = parseInt(inp.value) || 0;
    if (qty > 0) sizeList.push(`${inp.dataset.sz}:${qty}`);
  });
  db.ref('sales').push({
    ts: Date.now(),
    action: 'restock',
    itemId: id,
    itemName: item.name,
    type: item.type,
    location: item.location,
    qty: added,
    sizeBreakdown: sizeList.join(', '),
    unitCost,
    totalCost: unitCost * added,
    total: 0,
    cost: unitCost * added,
    user: currentUser,
    voided: false
  });

  showToast(`Restocked ${item.name}: +${added} units`);
  onRestockItemChange();
}

function populateEditDropdown() {
  const sel = document.getElementById('edit-item');
  sel.innerHTML = '<option value="">-- Choose --</option>';
  Object.entries(inventory).sort((a,b) => a[1].name.localeCompare(b[1].name)).forEach(([id,item]) => {
    const o = document.createElement('option');
    o.value = id; o.textContent = item.name + (item.location==='storage'?' [Storage]':'');
    sel.appendChild(o);
  });
}

function onEditItemChange() {
  const id = document.getElementById('edit-item').value;
  if (!id) { hide('edit-fields'); return; }
  const item = inventory[id];
  document.getElementById('edit-name').value = item.name;
  document.getElementById('edit-type').value = item.type;
  document.getElementById('edit-location').value = item.location;
  show('edit-fields');
}

function saveEditItem() {
  const id = document.getElementById('edit-item').value;
  if (!id) return;
  db.ref(`inventory/${id}/name`).set(document.getElementById('edit-name').value.trim());
  db.ref(`inventory/${id}/type`).set(document.getElementById('edit-type').value);
  db.ref(`inventory/${id}/location`).set(document.getElementById('edit-location').value);
  showToast('Item updated');
}

function deleteItem() {
  const id = document.getElementById('edit-item').value;
  if (!id) return;
  if (!confirm(`Delete "${inventory[id].name}"? Cannot be undone.`)) return;
  db.ref(`inventory/${id}`).remove();
  showToast('Item deleted');
  hide('edit-fields');
  document.getElementById('edit-item').value = '';
}

// ============ UTILS ============
function show(id) { document.getElementById(id).style.display = 'block'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 3000);
}

// Init add sizes
renderAddSizes();

// Load custom costs from Firebase
db.ref('customCosts').on('value', snap => {
  const data = snap.val() || {};
  Object.entries(data).forEach(([k,v]) => { COST['custom-'+k] = v; });
});
</script>
